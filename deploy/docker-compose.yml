services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: recruiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: recruiter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Same shared state file as bot/scheduler, otherwise the API would read a
      # stale copy in /tmp and miss the pause flag.
      - STATE_PATH=/state/ai_recruiter_state.json
    volumes:
      - ../state:/state
    networks: [default, v6net]

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.scheduler.dispatcher"]
    environment:
      - STATE_PATH=/state/ai_recruiter_state.json
    volumes:
      - ../state:/state
    networks: [default, v6net]


  scraper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.scraper.workua"]

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "src.bot.main"]
    environment:
      - STATE_PATH=/state/ai_recruiter_state.json
    volumes:
      - ../state:/state


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  tguserbot:
    build:
      context: ../tg_userbot
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - ../tg_userbot/data:/data
    expose:
      - "8090"

networks:
  default:
  # robota.ua's Cloudflare rejects this host's IPv4 and accepts its IPv6, so the
  # services that talk to robota.ua need a v6 stack. Docker NATs this ULA subnet
  # out through the host's global address.
  v6net:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:a1:c0de::/64

volumes:
  pgdata:
  caddy_data:
  caddy_config:
